vasudeva|Vasudeva|Yadava Prince|Y|yadu||devaki,rohini2|🕯️|Descendant of Yadu. Father of Krishna and Balarama.
devaki|Devaki|Mother of Krishna|Y|||vasudeva|🌷|Imprisoned by Kamsa.
rohini2|Rohini (of Gokula)|Wife of Vasudeva|Y|||vasudeva|🌷|Mother of Balarama.
krishna|Krishna|Eighth Avatar of Vishnu|Y,V|vasudeva|devaki|rukmini|🦚|Guided Arjuna with the Gita and defeated Kamsa.
balarama|Balarama|Elder Brother of Krishna|Y,V|vasudeva|rohini2||🌾|Plough-wielding brother of Krishna.
rukmini|Rukmini|Principal Queen of Krishna|Y|||krishna|🌹|An incarnation of Lakshmi.
pradyumna|Pradyumna|Son of Krishna|Y|krishna|rukmini||🏹|Considered a re-birth of Kamadeva.`;

const P={};
RAW.trim().split('\n').forEach(l=>{const[a,n,t,c,f,m,s,e,d]=l.split('|');P[a]={id:a,name:n,title:t,cats:c.split(','),f,m,sp:s?s.split(','):[],e,d,ch:[],S:new Set()}});
Object.values(P).forEach(p=>{
  [p.f,p.m].forEach(x=>{if(x&&P[x])P[x].ch.push(p.id)});
  p.sp.forEach(s=>{if(P[s]){p.S.add(s);P[s].S.add(p.id)}});
  if(P[p.f]&&P[p.m]){P[p.f].S.add(p.m);P[p.m].S.add(p.f)}
});
const CATS={T:['Trimurti','#fbbf24'],P:['Prajapatis','#facc15'],D:['Devas','#38bdf8'],A:['Asuras/Daityas','#fb7185'],S:['Sages','#34d399'],Y:['Dynasties','#a78bfa']};
const IMG={}; // optional: add image URLs, e.g. IMG.brahma='brahma.jpg'
const col=p=>(CATS[p.cats[0]]||CATS.D)[1];
const $=s=>document.querySelector(s);
let path=['brahma'],filter='';

const avatar=(p,sz)=>IMG[p.id]
  ?`<img src="${IMG[p.id]}" alt="${p.name}" class="rounded-full object-cover shrink-0" style="width:${sz}px;height:${sz}px;border:2px solid ${col(p)}">`
  :`<div class="rounded-full grid place-items-center shrink-0" style="width:${sz}px;height:${sz}px;font-size:${sz*.5}px;background:radial-gradient(circle at 30% 25%,${col(p)}66,#0f172a 75%);border:2px solid ${col(p)};box-shadow:0 0 14px ${col(p)}55" role="img" aria-label="${p.name}">${p.e}</div>`;

function card(id,big){
  const p=P[id];if(!p)return'';
  return `<div class="card ${big?'w-full max-w-md mx-auto p-5 text-center':'w-40 sm:w-44 shrink-0 p-3 text-center'} rounded-2xl bg-zinc-900/90 border border-amber-500/30 cursor-pointer" data-f="${id}" tabindex="0" role="button">
    <div class="flex justify-center mb-2">${avatar(p,big?112:64)}</div>
    <div class="title ${big?'text-2xl text-amber-300 glow':'text-sm text-amber-200'} leading-tight">${p.name}</div>
    <div class="text-slate-400 ${big?'text-sm mt-1':'text-[11px] mt-0.5'} leading-snug">${p.title}</div>
    ${p.cats.includes('V')?'<div class="mt-1 text-[10px] text-amber-300">★ Avatar of Vishnu</div>':''}
    <button class="mt-2 px-2.5 py-1 rounded-md text-xs border border-amber-500/40 text-amber-200 hover:bg-amber-500/15 inline-flex items-center gap-1" data-d="${id}"><i data-lucide="info" class="w-3 h-3"></i>View Details</button>
  </div>`;
}
const row=(ids,label)=>ids.length?`<section class="mt-6"><h3 class="text-sm text-amber-300/90 mb-2 title">${label}</h3><div class="flex flex-wrap sm:justify-center gap-3 justify-center">${ids.map(i=>card(i)).join('')}</div></section>`:'';

function lineage(id){const a=[];let c=P[id];while(c){a.unshift(c.id);c=P[c.f]||P[c.m]}return a}

function render(){
  const id=path[path.length-1],p=P[id];
  const sibs=(P[p.f]?P[p.f].ch:P[p.m]?P[p.m].ch:[]).filter(x=>x!==id&&(P[x].f===p.f&&P[x].m===p.m));
  const spouses=[...p.S];
  const groups={};p.ch.forEach(c=>{const o=P[c].f===id?P[c].m:P[c].f;(groups[o||'']=groups[o||'']||[]).push(c)});
  let h='<div class="stage">';
  const anc=lineage(id).slice(0,-1);
  if(anc.length)h+=`<div class="text-center text-xs text-slate-400 mb-3 scroll-x whitespace-nowrap">Ancestors: ${anc.map(a=>`<a href="#" class="text-amber-300 hover:underline" data-f="${a}">${P[a].name}</a>`).join(' › ')}</div>`;
  h+=row([p.f,p.m].filter(x=>x&&P[x]),'Parents');
  h+=`<div class="my-5 flex items-center justify-center"><div class="w-full">${card(id,true)}</div></div>`;
  h+=row(sibs,'Siblings (same parents)');
  h+=row(spouses,spouses.length>1?'Spouses':'Spouse');
  const keys=Object.keys(groups);
  if(keys.length){
    h+=`<h2 class="title text-xl text-amber-300 text-center mt-8 mb-1">Children</h2>`;
    keys.forEach(k=>h+=row(groups[k],k&&P[k]?`With ${P[k].name} (${groups[k].length})`:`Children (${groups[k].length})`));
  }else h+='<p class="text-center text-slate-500 mt-8 text-sm">No recorded children in this tree.</p>';
  h+='</div>';
  $('#stage').innerHTML=h;
  $('#crumbs').innerHTML=path.map((x,i)=>`<a href="#" data-c="${i}" class="${i===path.length-1?'text-amber-300 font-bold':'text-slate-300 hover:text-amber-200'}">${P[x].name}</a>`).join('<span class="text-slate-600 mx-1">›</span>');
  $('#crumbs').scrollLeft=1e5;
  $('#back').disabled=path.length<2;$('#back').classList.toggle('opacity-40',path.length<2);
  lucide.createIcons();
  window.scrollTo({top:0,behavior:'smooth'});
}
function go(id){if(!P[id]||id===path[path.length-1])return;path.push(id);render()}
const chip=(id)=>`<button class="m-0.5 px-2.5 py-1 rounded-full text-xs border" style="border-color:${col(P[id])};color:${col(P[id])}" data-j="${id}">${P[id].e} ${P[id].name}</button>`;
function sect(l,ids){return ids.length?`<div class="mt-4"><div class="text-xs text-slate-400 mb-1">${l}</div>${ids.map(chip).join('')}</div>`:''}
function openDrawer(id){
  const p=P[id],d=$('#drawer');
  d.innerHTML=`<div class="p-5"><button class="float-right p-1 rounded hover:bg-slate-800" id="closeD" aria-label="Close"><i data-lucide="x" class="w-5 h-5"></i></button>
  <div class="flex justify-center my-3">${avatar(p,128)}</div>
  <h2 class="title text-2xl text-amber-300 glow text-center">${p.name}</h2>
  <p class="text-center text-slate-300 text-sm">${p.title}</p>
  <div class="flex flex-wrap justify-center gap-1 mt-2">${p.cats.map(c=>c==='V'?'<span class="text-xs px-2 py-0.5 rounded-full bg-amber-500 text-slate-950 font-bold">Avatar of Vishnu</span>':`<span class="text-xs px-2 py-0.5 rounded-full border" style="border-color:${CATS[c][1]};color:${CATS[c][1]}">${CATS[c][0]}</span>`).join('')}</div>
  <div class="mt-4 text-sm leading-relaxed bg-zinc-900 border border-amber-500/20 rounded-xl p-3"><b class="text-amber-200">Puranic summary.</b> ${p.d}</div>
  ${sect('Father',P[p.f]?[p.f]:[])}${sect('Mother',P[p.m]?[p.m]:[])}${sect('Spouse(s)',[...p.S])}${sect('Children ('+p.ch.length+')',p.ch)}
  <button class="mt-6 w-full py-2 rounded-lg bg-amber-500 text-slate-950 font-bold" data-j="${id}">Focus on ${p.name}</button></div>`;
  d.classList.remove('translate-x-full');$('#scrim').classList.remove('hidden');lucide.createIcons();
}
const closeDrawer=()=>{$('#drawer').classList.add('translate-x-full');$('#scrim').classList.add('hidden')};

function search(){
  const q=$('#q').value.trim().toLowerCase(),r=$('#results');
  if(!q&&!filter){r.classList.add('hidden');return}
  const m=Object.values(P).filter(p=>(!q||p.name.toLowerCase().includes(q)||p.title.toLowerCase().includes(q))&&(!filter||p.cats.includes(filter)));
  r.classList.remove('hidden');
  r.innerHTML=m.length?m.slice(0,60).map(p=>`<button class="w-full flex items-center gap-3 px-3 py-2 text-left hover:bg-slate-800" data-j="${p.id}">${avatar(p,32)}<span><span class="text-sm text-amber-200">${p.name}</span><span class="block text-[11px] text-slate-400">${p.title}</span></span></button>`).join(''):'<div class="p-3 text-sm text-slate-400">No match. Try another spelling or clear the filter.</div>';
}
function pills(){
  $('#pills').innerHTML=Object.entries(CATS).map(([k,[n,c]])=>`<button data-p="${k}" class="px-3 py-1 rounded-full text-xs whitespace-nowrap border" style="border-color:${c};${filter===k?`background:${c};color:#020617;font-weight:700`:`color:${c}`}">${n}</button>`).join('');
}

document.addEventListener('click',e=>{
  const t=e.target,d=t.closest('[data-d]'),j=t.closest('[data-j]'),f=t.closest('[data-f]'),c=t.closest('[data-c]'),pl=t.closest('[data-p]');
  if(d){e.stopPropagation();openDrawer(d.dataset.d);return}
  if(j){closeDrawer();$('#results').classList.add('hidden');$('#q').value='';filter='';pills();go(j.dataset.j);return}
  if(pl){filter=filter===pl.dataset.p?'':pl.dataset.p;pills();search();return}
  if(c){e.preventDefault();path=path.slice(0,+c.dataset.c+1);render();return}
  if(f){e.preventDefault();go(f.dataset.f);return}
  if(t.closest('#closeD')||t.id==='scrim')closeDrawer();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDrawer();
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.f&&e.target.tagName==='DIV'){e.preventDefault();go(e.target.dataset.f)}
});
$('#q').addEventListener('input',search);
$('#home').onclick=()=>{path=['brahma'];closeDrawer();render()};
$('#back').onclick=()=>{if(path.length>1){path.pop();render()}};
pills();render();
</script>
</body>
</html>
